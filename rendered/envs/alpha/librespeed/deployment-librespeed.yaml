apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: librespeed
spec:
  selector:
    matchLabels:
      app: librespeed
  template:
    metadata:
      labels:
        app: librespeed
    spec:
      containers:
        - env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: librespeed
          image: index.docker.io/linuxserver/librespeed@sha256:e236f2c4473bd85ee0f594e2d1762c4b1497dc48aa2cd7884b7da539d89f6729
          name: librespeed
          ports:
            - containerPort: 80
              name: http
