apiVersion: v1
data:
  blackbox.yml: |
    modules:
      dns-a:
        prober: dns
        timeout: 5s
        dns:
          query_name: lan.zebradil.dev
          query_type: A
          transport_protocol: udp
          valid_rcodes:
          - NOERROR
kind: ConfigMap
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: blackbox-exporter
