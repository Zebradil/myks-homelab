apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: blackbox-exporter
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
      to:
        - ipBlock:
            cidr: 192.168.0.53/32
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  policyTypes:
    - Egress
