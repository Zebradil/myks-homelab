apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: starbase80
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: starbase80
  template:
    metadata:
      annotations:
        checksum/config: c1c2b5a5fe04cf5ed5a8f242f76637bd
      labels:
        app.kubernetes.io/name: starbase80
    spec:
      containers:
        - image: index.docker.io/library/nginx@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
          name: server
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETGID
                - SETUID
              drop:
                - all
            privileged: false
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: static
              readOnly: true
      initContainers:
        - args:
            - sh
            - -c
            - |
              npm run build
              cp -vr public/. /static/
          env:
            - name: TITLE
              value: ""
          image: index.docker.io/jordanroher/starbase-80@sha256:249bcbb108afba0f597fa2d0c2a55325376f42c01b757e0fe26848222d4eb969
          name: builder
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /static
              name: static
            - mountPath: /app/src/config/config.json
              name: config
              readOnly: true
              subPath: config.json
      volumes:
        - emptyDir: {}
          name: static
        - configMap:
            name: config
          name: config
