apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: karma
  namespace: karma
spec:
  egress:
    - ports:
        - port: 9093
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vmks
  podSelector:
    matchLabels:
      app.kubernetes.io/name: karma
  policyTypes:
    - Egress
