apiVersion: v1
kind: Secret
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: snmp-exporter-auths
stringData:
  snmp.yml: |
    auths:
      synology_v3:
        version: 3
        security_level: authPriv
        username: ref+sops://static/0.sops.yaml#/username+
        password: ref+sops://static/0.sops.yaml#/authPassword+
        auth_protocol: SHA
        priv_protocol: AES
        priv_password: ref+sops://static/0.sops.yaml#/privPassword+
