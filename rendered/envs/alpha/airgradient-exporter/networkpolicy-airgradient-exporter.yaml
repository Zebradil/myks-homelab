apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: airgradient-exporter
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.99/32
  podSelector:
    matchLabels:
      app.kubernetes.io/name: airgradient-exporter
  policyTypes:
    - Egress
