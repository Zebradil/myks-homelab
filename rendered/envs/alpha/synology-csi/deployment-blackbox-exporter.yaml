apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: blackbox-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      annotations:
        checksum/config: 8e098d4c7f3a6ee3007771f55f32730f723758377085ad578e656630c0db7491
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      containers:
        - args:
            - --config.file=/etc/blackbox/blackbox.yml
          image: oci.zebradil.dev/quay.io-cache/prometheus/blackbox-exporter@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
          name: blackbox-exporter
          ports:
            - containerPort: 9115
              name: http
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
          volumeMounts:
            - mountPath: /etc/blackbox
              name: config
              readOnly: true
      volumes:
        - configMap:
            name: blackbox-exporter
          name: config
