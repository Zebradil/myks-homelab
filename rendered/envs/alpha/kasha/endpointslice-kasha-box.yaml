addressType: IPv4
apiVersion: discovery.k8s.io/v1
endpoints:
  - addresses:
      - 192.168.0.101
    conditions:
      ready: true
      serving: true
      terminating: false
kind: EndpointSlice
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  labels:
    kubernetes.io/service-name: kasha
  name: kasha-box
ports:
  - name: http
    port: 5000
    protocol: TCP
