apiVersion: v1
data:
  kasha-dashboard.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "kasha"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "legacyOptions": {
                "type": "dashboard"
              },
              "name": "Annotations \u0026 Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "Box health and traffic from kasha's /metrics endpoint, for one or more boxes of a scrape job.",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "count(max by (instance) (up{job=\"$job\", instance=~\"$instance\"}) == 0) or vector(0)",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Selected boxes Prometheus failed to scrape on its last attempt (up == 0). A box no service discovery lists any more drops out instead of counting as down. Every other panel goes blank for a box that is down.",
              "id": 1,
              "links": [],
              "title": "Boxes down",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "red",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value",
                    "wideLayout": true
                  }
                },
                "version": ""
              }
            }
          },
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max(kasha_pull_through_queued{job=\"$job\", instance=~\"$instance\"})",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Pull-through downloads not started yet, worst box. A queue that does not drain for 30 minutes fires KashaPullThroughBacklog: raise KASHA_PULL_THROUGH_WORKERS or look for a slow source.",
              "id": 10,
              "links": [],
              "title": "Pull queue",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "noValue": "pull-through off",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "yellow",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value",
                    "wideLayout": true
                  }
                },
                "version": ""
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max(kasha_unlisted_bytes{job=\"$job\", instance=~\"$instance\"} / kasha_unlisted_max_bytes{job=\"$job\", instance=~\"$instance\"})",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Unlisted bytes against KASHA_UNLISTED_MAX_BYTES after the last eviction pass, worst box. Above 100 % only paths used in the last 10 minutes are left: raise the cap. Red matches the KashaUnlistedOverCap alert.",
              "id": 11,
              "links": [],
              "title": "Cap used",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "noValue": "no cap",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "yellow",
                            "value": 0.9
                          },
                          {
                            "color": "red",
                            "value": 1.0001
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value",
                    "wideLayout": true
                  }
                },
                "version": ""
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(max by (instance, compression) (kasha_nar_compression_bytes{job=\"$job\", instance=~\"$instance\", compression!=\"zstd\"}))",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "NAR bytes on disk whose file is not zstd (xz, bzip2, none, other), summed over the selected boxes. With KASHA_REENCODE on this falls as the re-encoder works and orphan removal takes the old files, a day or more later. Refreshed at most every 5 minutes.",
              "id": 12,
              "links": [],
              "title": "Not zstd",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "fixedColor": "text",
                        "mode": "fixed"
                      },
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value",
                    "wideLayout": true
                  }
                },
                "version": ""
              }
            }
          },
          "panel-13": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (result) (increase(kasha_narinfo_requests_total{job=\"$job\", instance=~\"$instance\"}[$__interval]))",
                            "legendFormat": "{{result}}"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "5m"
                  },
                  "transformations": []
                }
              },
              "description": "Narinfo GET/HEAD requests per interval by result, summed over the selected boxes. hit: the box had it (or pull-through found it). miss: answered 404, the client falls back to its next substituter.",
              "id": 13,
              "links": [],
              "title": "Narinfo requests",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "axisSoftMin": 0,
                        "barAlignment": -1,
                        "drawStyle": "bars",
                        "fillOpacity": 70,
                        "lineWidth": 0,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "min": 0,
                      "unit": "short"
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(hit|found|stored|accepted|reencoded|waited)$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "green",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\bmiss$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\bnegative$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "light-blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(abandoned|lost)$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "purple",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(failed|rejected|error)$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "red",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(busy|capped|unauthorized)$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "orange",
                              "mode": "fixed"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-14": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (instance) (rate(kasha_narinfo_requests_total{job=\"$job\", instance=~\"$instance\", result=\"hit\"}[1h])) / sum by (instance) (rate(kasha_narinfo_requests_total{job=\"$job\", instance=~\"$instance\"}[1h]))",
                            "legendFormat": "{{instance}}"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Share of narinfo lookups the box answered, over the preceding hour. Falls when clients ask for paths the box neither holds nor can pull through.",
              "id": 14,
              "links": [],
              "title": "Narinfo hit ratio",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "axisSoftMin": 0,
                        "fillOpacity": 0,
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "max": 1,
                      "min": 0,
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-15": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (direction, source) (increase(kasha_nar_bytes_total{job=\"$job\", instance=~\"$instance\"}[$__interval])) \u003e 0",
                            "legendFormat": "{{direction}} {{source}}"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "5m"
                  },
                  "transformations": []
                }
              },
              "description": "NAR bytes moved per interval, summed over the selected boxes. served: sent to clients. ingest: pushed in. down/pull: fetched by mirror-down or pull-through, by source (pull counts bytes as the source sent them). up: mirrored to the remote cache. Counted when a transfer completes, so one large NAR shows as one tall bar.",
              "id": 15,
              "links": [],
              "title": "NAR bytes by route",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "axisSoftMin": 0,
                        "barAlignment": -1,
                        "drawStyle": "bars",
                        "fillOpacity": 70,
                        "lineWidth": 0,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "min": 0,
                      "unit": "bytes"
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^served.*"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "green",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^ingest.*"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "yellow",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^down remote"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^down upstream"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "light-blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^pull remote"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "purple",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^pull upstream"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "light-purple",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": "^up.*"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "orange",
                              "mode": "fixed"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-16": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (direction, source) (increase(kasha_nar_bytes_total{job=\"$job\", instance=~\"$instance\"}[$__range]))",
                            "instant": true,
                            "legendFormat": "{{direction}} {{source}}",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Total NAR bytes per route over the time range, summed over the selected boxes. The served/fetched balance says how much the box saves its clients' uplinks.",
              "id": 16,
              "links": [],
              "title": "NAR bytes by route in range",
              "vizConfig": {
                "group": "bargauge",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "fixedColor": "blue",
                        "mode": "fixed"
                      },
                      "min": 0,
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayMode": "basic",
                    "namePlacement": "left",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showUnfilled": true,
                    "sizing": "auto",
                    "valueMode": "text"
                  }
                },
                "version": ""
              }
            }
          },
          "panel-17": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (instance, result) (increase(kasha_ingest_requests_total{job=\"$job\", instance=~\"$instance\"}[$__interval])) \u003e 0",
                            "legendFormat": "{{instance}} {{result}}"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "5m"
                  },
                  "transformations": []
                }
              },
              "description": "PUT requests per interval by result. accepted: stored. rejected: bad content or a signature from no KASHA_TRUSTED_KEYS key (rejected ingest in the logs). unauthorized: no valid KASHA_TOKEN.",
              "id": 17,
              "links": [],
              "title": "Pushes",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "axisSoftMin": 0,
                        "barAlignment": -1,
                        "drawStyle": "bars",
                        "fillOpacity": 70,
                        "lineWidth": 0,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "min": 0,
                      "noValue": "No pushes in range",
                      "unit": "short"
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(hit|found|stored|accepted|reencoded|waited)$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "green",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\bmiss$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\bnegative$"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "light-blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byRegexp",
                          "options": ".*\\b(abandoned|lost)$"
