apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: kasha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kasha
  strategy:
    rollingUpdate: null
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasha
    spec:
      containers:
        - env:
            - name: KASHA_DATA
              value: /kasha
            - name: KASHA_LISTEN
              value: 0.0.0.0:5000
            - name: KASHA_TRUSTED_KEYS
              value: |
                cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= kasha-ci-1:KNW/sz+Zz800U/IFZ38vH5rvlHtM3Fb0Q/wmDJquG+U= znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= cache.flakehub.com-4:Asi8qIv291s0aYLyH6IOnr5Kf6+OF14WVjkE6t3xMio= cache.flakehub.com-5:zB96CRlL7tiPtzA9/WKyPkp3A2vqxqgdgyTVNGShPDU= cache.flakehub.com-6:W4EGFwAGgBj3he7c5fNh9NkOXw0PUVaxygCVKeuvaqU= cache.flakehub.com-7:mvxJ2DZVHn/kRxlIaxYNMuDG1OvMckZu32um1TadOR8= cache.flakehub.com-8:moO+OVS0mnTjBTcOUh2kYLQEd59ExzyoW1QgQ8XAARQ= cache.flakehub.com-9:wChaSeTI6TeCuV/Sg2513ZIM9i0qJaYsF+lZCXg0J6o= cache.flakehub.com-10:2GqeNlIp6AKp4EF2MVbE1kBOp9iBSyo0UPR9KoR0o1Y=
            - name: KASHA_REMOTE
              value: ref+sops://static/0.sops.yaml#/cache-s3-url+
            - name: KASHA_SYNC_INTERVAL
              value: "300"
          envFrom:
            - secretRef:
                name: kasha
          image: oci.zebradil.dev/ghcr.io-cache/zebradil/kasha-box@sha256:70acb88b026e95d804240d136fc99c00afd70a8c0455547dd43289f2733cfeb3
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          name: kasha
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 3Gi
            requests:
              cpu: 300m
              memory: 1300Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
          volumeMounts:
            - mountPath: /kasha
              name: kasha
      volumes:
        - name: kasha
          persistentVolumeClaim:
            claimName: kasha
