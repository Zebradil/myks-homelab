apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: kasha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kasha
  strategy:
    rollingUpdate: null
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasha
    spec:
      containers:
        - env:
            - name: KASHA_DATA
              value: /kasha
            - name: KASHA_LISTEN
              value: 0.0.0.0:5000
            - name: KASHA_TRUSTED_KEYS
              value: |
                cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= kasha-ci-1:KNW/sz+Zz800U/IFZ38vH5rvlHtM3Fb0Q/wmDJquG+U= znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=
            - name: KASHA_REMOTE
              value: ref+sops://static/0.sops.yaml#/cache-s3-url+
            - name: KASHA_SYNC_INTERVAL
              value: "300"
          envFrom:
            - secretRef:
                name: kasha
          image: oci.zebradil.dev/ghcr.io-cache/zebradil/kasha-box@sha256:73532aa22fcdfe275528cc05086435d8c809431a9921275563e9f116be151e4d
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          name: kasha
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1100Mi
            requests:
              cpu: 300m
              memory: 1100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
          volumeMounts:
            - mountPath: /kasha
              name: kasha
      volumes:
        - name: kasha
          persistentVolumeClaim:
            claimName: kasha
