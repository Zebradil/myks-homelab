          "timeline": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (repository, job_name) (label_replace(arc_ephemeralrunner_job_info{repository=~\"$repository\", job_display_name!=\"\"}, \"job_name\", \"$1\", \"job_display_name\", \"(.+)\") or label_set((sum by (repository, job_name) (increase(gha_completed_jobs_total{repository=~\"$repository\", job_result=\"succeeded\"}[$__interval])) \u003e 0) * 0 + 2, \"src\", \"ok\") or label_set((sum by (repository, job_name) (increase(gha_completed_jobs_total{repository=~\"$repository\", job_result!=\"succeeded\"}[$__interval])) \u003e 0) * 0 + 3, \"src\", \"failed\"))",
                            "instant": false,
                            "legendFormat": "{{repository}} · {{job_name}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "20s",
                    "maxDataPoints": 300
                  },
                  "transformations": []
                }
              },
              "description": "One row per workflow job. Blue: a runner holds the job (EphemeralRunner objects through kube-state-metrics, sampled every 20 s). Green or red: the job finished in that step, from the listener's counters, so jobs shorter than a sample still show up.",
              "id": 7,
              "links": [],
