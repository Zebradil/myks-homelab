apiVersion: v1
data:
  arc-homelab-dashboard.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "homelab-runners"
      },
      "spec": {
        "annotations": [],
        "cursorSync": "Crosshair",
        "description": "ARC scale sets on the homelab cluster (runs-on: homelab) and the daddy host their builds run on.",
        "editable": true,
        "elements": {
          "completed": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "round(sum(increase(gha_completed_jobs_total{repository=~\"$repository\"}[$__range])))",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Over the selected time range.",
              "id": 5,
              "links": [],
              "title": "Jobs completed",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "noValue": "0",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "blue",
                            "value": null
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "completed_bars": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (job_result) (increase(gha_completed_jobs_total{repository=~\"$repository\"}[$__interval]))",
                            "instant": false,
                            "legendFormat": "{{job_result}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "1m",
                    "maxDataPoints": 50
                  },
                  "transformations": []
                }
              },
              "description": "Jobs finished per bar. The bar width follows the time range: about 50 bars, at least a minute each.",
              "id": 9,
              "links": [],
              "title": "Jobs completed",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "barAlignment": -1,
                        "drawStyle": "bars",
                        "fillOpacity": 80,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "decimals": 0
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "succeeded"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "green",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "failed"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "red",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "canceled"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "gray",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "cancelled"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "gray",
                              "mode": "fixed"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "cpu": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (mode) (rate(node_cpu_seconds_total{instance=\"$daddy\", mode!=\"idle\"}[$__rate_interval])) / scalar(count(node_cpu_seconds_total{instance=\"$daddy\", mode=\"idle\"}))",
                            "instant": false,
                            "legendFormat": "{{mode}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Busy time by mode across all cores. iowait points at the disks rather than the CPU.",
              "id": 21,
              "links": [],
              "title": "CPU",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 60,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "max": 1,
                      "min": 0,
                      "unit": "percentunit"
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "iowait"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "orange",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "system"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "red",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "user"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "blue",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "nice"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "green",
                              "mode": "fixed"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "disk_busy": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "rate(node_disk_io_time_seconds_total{instance=\"$daddy\", device=~\"sd.*|nvme.*\"}[$__rate_interval])",
                            "instant": false,
                            "legendFormat": "{{device}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Share of time each disk had I/O in flight. Near 100% the disk is the bottleneck.",
              "id": 26,
              "links": [],
              "title": "Disk busy",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "max": 1,
                      "min": 0,
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "disk_io": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (device) (rate(node_disk_read_bytes_total{instance=\"$daddy\", device=~\"sd.*|nvme.*\"}[$__rate_interval]))",
                            "instant": false,
                            "legendFormat": "{{device}} read",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "-sum by (device) (rate(node_disk_written_bytes_total{instance=\"$daddy\", device=~\"sd.*|nvme.*\"}[$__rate_interval]))",
                            "instant": false,
                            "legendFormat": "{{device}} write",
                            "range": true,
                            "refId": "B"
                          },
                          "version": "v0"
                        },
                        "refId": "B"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Writes plotted below zero. sdb is the SSD (root, Nix store, BuildKit), sda the HDD (kasha, media).",
              "id": 25,
              "links": [],
              "title": "Disk throughput",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "drawStyle": "line",
                        "fillOpacity": 20,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "unit": "Bps"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "duration": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (repository, job_name) (increase(gha_job_execution_duration_seconds_sum{repository=~\"$repository\"}[$__interval])) / sum by (repository, job_name) (increase(gha_job_execution_duration_seconds_count{repository=~\"$repository\"}[$__interval]))",
                            "instant": false,
                            "legendFormat": "{{repository}} · {{job_name}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "interval": "1m",
                    "maxDataPoints": 200
                  },
                  "transformations": []
                }
              },
              "description": "Each point is the mean duration of the jobs with that name that finished in that interval. Logarithmic axis: jobs range from seconds to tens of minutes.",
              "id": 11,
              "links": [],
              "title": "Job duration",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "points",
                        "fillOpacity": 0,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 8,
                        "scaleDistribution": {
                          "log": 10,
                          "type": "log"
                        },
                        "showPoints": "always",
                        "spanNulls": false
                      },
                      "unit": "s"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "failed": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "round(sum(increase(gha_completed_jobs_total{repository=~\"$repository\", job_result!=\"succeeded\"}[$__range])))",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Failed or cancelled jobs over the selected time range.",
              "id": 6,
              "links": [],
              "title": "Jobs not succeeded",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "noValue": "0",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "red",
                            "value": 1
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "fs_free": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "node_filesystem_avail_bytes{instance=\"$daddy\", mountpoint=~\"/|/srv/hdd\"}",
                            "instant": false,
                            "legendFormat": "{{mountpoint}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "The SSD root holds the Nix store and BuildKit's cache. BuildKit garbage-collects to keep 50 GB free (dashed line) and caps its cache at 100 GB; nix-gc runs on a timer.",
              "id": 18,
              "links": [],
              "title": "Free space",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false,
                        "thresholdsStyle": {
                          "mode": "dashed"
                        }
                      },
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "transparent",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 50000000000
                          }
                        ]
                      },
                      "unit": "bytes"
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "/"
                        },
                        "properties": [
                          {
                            "id": "displayName",
                            "value": "/ (Nix store, BuildKit cache)"
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "/srv/hdd"
                        },
                        "properties": [
                          {
                            "id": "displayName",
                            "value": "/srv/hdd (kasha)"
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "jobs_by_repo": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (repository) (gha_running_jobs{repository=~\"$repository\"})",
                            "instant": false,
                            "legendFormat": "{{repository}} running",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "clamp_min(sum(gha_assigned_jobs{repository=~\"$repository\"} - gha_running_jobs{repository=~\"$repository\"}), 0)",
                            "instant": false,
                            "legendFormat": "waiting",
                            "range": true,
                            "refId": "B"
                          },
                          "version": "v0"
                        },
                        "refId": "B"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(gha_assigned_jobs{repository=~\"$repository\"})",
                            "instant": false,
                            "legendFormat": "total",
                            "range": true,
                            "refId": "C"
                          },
                          "version": "v0"
                        },
                        "refId": "C"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Running jobs stacked per repository, with jobs waiting for a runner on top; `total` is every assigned job.",
              "id": 13,
              "links": [],
              "title": "Jobs by repository",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 40,
                        "lineInterpolation": "stepAfter",
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        }
                      },
                      "decimals": 0
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "waiting"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "orange",
                              "mode": "fixed"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "total"
                        },
                        "properties": [
                          {
                            "id": "custom.stacking",
                            "value": {
                              "group": "A",
                              "mode": "none"
                            }
                          },
                          {
                            "id": "custom.fillOpacity",
                            "value": 0
                          },
                          {
                            "id": "custom.lineWidth",
                            "value": 2
                          },
                          {
                            "id": "custom.lineStyle",
                            "value": {
                              "dash": [
                                10,
                                10
                              ],
                              "fill": "dash"
                            }
                          },
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "text",
                              "mode": "fixed"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
