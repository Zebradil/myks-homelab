                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (repository, job_name) (increase(gha_job_startup_duration_seconds_sum{repository=~\"$repository\"}[$__range])) / sum by (repository, job_name) (increase(gha_job_startup_duration_seconds_count{repository=~\"$repository\"}[$__range]))",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "queue"
                          },
                          "version": "v0"
                        },
                        "refId": "queue"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (repository, job_name) (increase(gha_job_execution_duration_seconds_sum{repository=~\"$repository\"}[$__range])) / sum by (repository, job_name) (increase(gha_job_execution_duration_seconds_count{repository=~\"$repository\"}[$__range]))",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "duration"
                          },
                          "version": "v0"
                        },
                        "refId": "duration"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (repository, job_name) (increase(gha_job_execution_duration_seconds_sum{repository=~\"$repository\"}[$__range]))",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "total"
                          },
                          "version": "v0"
                        },
                        "refId": "total"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": [
                    {
                      "group": "merge",
                      "kind": "Transformation",
                      "spec": {
                        "options": {}
                      }
                    },
                    {
                      "group": "organize",
                      "kind": "Transformation",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true
                          },
                          "indexByName": {
                            "Value #duration": 5,
                            "Value #failed": 3,
                            "Value #queue": 4,
                            "Value #runs": 2,
                            "Value #total": 6,
                            "job_name": 1,
                            "repository": 0
                          },
                          "renameByName": {
                            "Value #duration": "Mean duration",
                            "Value #failed": "Not succeeded",
                            "Value #queue": "Mean queue time",
                            "Value #runs": "Runs",
                            "Value #total": "Runner time",
                            "job_name": "Job",
                            "repository": "Repository"
                          }
                        }
                      }
                    }
                  ]
                }
              },
