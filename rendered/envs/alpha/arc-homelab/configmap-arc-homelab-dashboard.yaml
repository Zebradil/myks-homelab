                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "round(sum by (repository, job_name) (increase(gha_completed_jobs_total{repository=~\"$repository\", job_result!=\"succeeded\"}[$__range]))) or 0 * sum by (repository, job_name) (gha_completed_jobs_total{repository=~\"$repository\"})",
