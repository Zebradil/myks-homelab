          "waiting_why": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(gha_controller_pending_ephemeral_runners{repository=~\"$repository\"}) * (sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"used\"}) \u003e= bool sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"hard\"}))",
                            "instant": false,
                            "legendFormat": "pod quota full",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(gha_controller_pending_ephemeral_runners{repository=~\"$repository\"}) * (1 - (sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"used\"}) \u003e= bool sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"hard\"})))",
                            "instant": false,
                            "legendFormat": "pod starting",
                            "range": true,
                            "refId": "B"
                          },
                          "version": "v0"
                        },
                        "refId": "B"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "clamp_min(sum(gha_assigned_jobs{repository=~\"$repository\"} - gha_running_jobs{repository=~\"$repository\"}) - sum(gha_controller_pending_ephemeral_runners{repository=~\"$repository\"}), 0)",
                            "instant": false,
                            "legendFormat": "other",
                            "range": true,
                            "refId": "C"
                          },
                          "version": "v0"
                        },
                        "refId": "C"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "count(gha_assigned_jobs{repository=~\"$repository\"} \u003e= gha_max_runners{repository=~\"$repository\"}) or vector(0)",
                            "instant": false,
                            "legendFormat": "repos at maxRunners",
                            "range": true,
                            "refId": "D"
                          },
                          "version": "v0"
                        },
                        "refId": "D"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"used\"})",
                            "instant": false,
                            "legendFormat": "pods used",
                            "range": true,
                            "refId": "E"
                          },
                          "version": "v0"
                        },
                        "refId": "E"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum(kube_resourcequota{namespace=\"arc-homelab\",resourcequota=\"runners\",resource=\"pods\",type=\"hard\"})",
                            "instant": false,
                            "legendFormat": "pod quota",
                            "range": true,
                            "refId": "F"
                          },
                          "version": "v0"
                        },
                        "refId": "F"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Jobs assigned to a runner but not running yet, stacked by cause: runner pods pending while the namespace quota is full (pod quota full), runner pods pending below the quota, so scheduling or image pull (pod starting), and the rest, waiting on GitHub or the listener (other). A scale set never takes more jobs than its maxRunners: further jobs stay queued on GitHub, invisible here, so the line \"repos at maxRunners\" counts the repositories that are at that cap. The pod lines cover all repositories.",
