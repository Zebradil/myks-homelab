apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: arc-homelab
  namespace: arc-system
spec:
  groups:
    - name: arc-homelab
      rules:
        - alert: HomelabRunnerJobsPending
          annotations:
            description: '{{ $value }} job(s) assigned to the homelab scale set have had no runner for 10 minutes. Either runner pods cannot start (image pull, ResourceQuota `runners`, scheduling: check `kubectl -n arc-homelab get ephemeralrunners,pods` and events) or more jobs are queued than the pool holds (maxRunners 50 per repository, 50 pods in total).'
            summary: Jobs for {{ $labels.repository }} wait for a homelab runner
          expr: max by (repository) (gha_assigned_jobs - gha_running_jobs) > 0
          for: 10m
          labels:
            severity: warning
