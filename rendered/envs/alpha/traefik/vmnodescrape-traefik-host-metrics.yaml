apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: traefik-host-metrics
spec:
  path: /metrics
  port: "19100"
  selector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - junior
