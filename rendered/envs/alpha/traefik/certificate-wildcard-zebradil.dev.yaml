apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: wildcard-zebradil.dev
spec:
  dnsNames:
    - zebradil.dev
    - '*.zebradil.dev'
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-zerossl
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: wildcard-zebradil.dev-tls
