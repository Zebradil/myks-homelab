apiVersion: v1
data:
  vmks-storage.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "cluster-storage"
      },
      "spec": {
        "annotations": [],
        "cursorSync": "Crosshair",
        "description": "Persistent volumes, NAS and node disks. Pick a namespace to inspect it after an alert.",
        "editable": true,
        "elements": {
          "be-csi-errors": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "sum by (method_name, grpc_status_code) (increase(csi_operations_seconds_count{grpc_status_code!=\"OK\"}[$__rate_interval]))",
                            "instant": false,
                            "legendFormat": "{{method_name}} {{grpc_status_code}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Failed CSI calls made by kubelet (attach, mount, stats).",
              "id": 31,
              "links": [],
              "title": "CSI operation errors",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [
                        "sum"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "Total",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-csi-latency": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "histogram_quantile(0.95, sum by (method_name, le) (rate(csi_operations_seconds_bucket[$__rate_interval])))",
                            "instant": false,
                            "legendFormat": "{{method_name}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "",
              "id": 32,
              "links": [],
              "title": "CSI operation p95 latency",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "unit": "s"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "Mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-nas-disks": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (diskID, diskModel) (diskModel)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "model"
                          },
                          "version": "v0"
                        },
                        "refId": "model"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (diskID) (diskStatus)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "status"
                          },
                          "version": "v0"
                        },
                        "refId": "status"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (diskID) (diskHealthStatus)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "health"
                          },
                          "version": "v0"
                        },
                        "refId": "health"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (diskID) (diskTemperature)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "temp"
                          },
                          "version": "v0"
                        },
                        "refId": "temp"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (diskID) (diskBadSector)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "bad"
                          },
                          "version": "v0"
                        },
                        "refId": "bad"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": [
                    {
                      "group": "merge",
                      "kind": "Transformation",
                      "spec": {
                        "id": "merge",
                        "options": {}
                      }
                    },
                    {
                      "group": "organize",
                      "kind": "Transformation",
                      "spec": {
                        "id": "organize",
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "Value #model": true
                          },
                          "renameByName": {
                            "Value #bad": "bad sectors",
                            "Value #health": "health",
                            "Value #status": "status",
                            "Value #temp": "temperature",
                            "diskID": "disk",
                            "diskModel": "model"
                          }
                        }
                      }
                    }
                  ]
                }
              },
              "description": "",
              "id": 24,
              "links": [],
              "title": "NAS disks",
              "vizConfig": {
                "group": "table",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          }
                        ]
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "status"
                        },
                        "properties": [
                          {
                            "id": "mappings",
                            "value": [
                              {
                                "options": {
                                  "1": {
                                    "color": "green",
                                    "text": "Normal"
                                  },
                                  "2": {
                                    "color": "blue",
                                    "text": "Initialized"
                                  },
                                  "3": {
                                    "color": "orange",
                                    "text": "Not initialized"
                                  },
                                  "4": {
                                    "color": "red",
                                    "text": "System partition failed"
                                  },
                                  "5": {
                                    "color": "red",
                                    "text": "Crashed"
                                  }
                                },
                                "type": "value"
                              }
                            ]
                          },
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-text"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "health"
                        },
                        "properties": [
                          {
                            "id": "mappings",
                            "value": [
                              {
                                "options": {
                                  "1": {
                                    "color": "green",
                                    "text": "Normal"
                                  },
                                  "2": {
                                    "color": "orange",
                                    "text": "Warning"
                                  },
                                  "3": {
                                    "color": "red",
                                    "text": "Critical"
                                  },
                                  "4": {
                                    "color": "red",
                                    "text": "Failing"
                                  }
                                },
                                "type": "value"
                              }
                            ]
                          },
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-text"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "temperature"
                        },
                        "properties": [
                          {
                            "id": "unit",
                            "value": "celsius"
                          },
                          {
                            "id": "thresholds",
                            "value": {
                              "mode": "absolute",
                              "steps": [
                                {
                                  "color": "green",
                                  "value": null
                                },
                                {
                                  "color": "orange",
                                  "value": 50
                                },
                                {
                                  "color": "red",
                                  "value": 60
                                }
                              ]
                            }
                          },
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-text"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "bad sectors"
                        },
                        "properties": [
                          {
                            "id": "thresholds",
                            "value": {
                              "mode": "absolute",
                              "steps": [
                                {
                                  "color": "green",
                                  "value": null
                                },
                                {
                                  "color": "orange",
                                  "value": 1
                                }
                              ]
                            }
                          },
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-text"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "options": {
                    "cellHeight": "sm",
                    "showHeader": true
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-node-fs": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "1 - node_filesystem_avail_bytes{job=\"node-exporter\", fstype=~\"ext4|btrfs|xfs|zfs\", mountpoint!~\"/boot.*|/nix/store\"} / node_filesystem_size_bytes{job=\"node-exporter\", fstype=~\"ext4|btrfs|xfs|zfs\", mountpoint!~\"/boot.*|/nix/store\"} * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info{job=\"node-exporter\"})",
                            "instant": true,
                            "legendFormat": "{{nodename}} {{mountpoint}}",
                            "range": false,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Root and data filesystems of the cluster nodes. local-path volumes live on these.",
              "id": 28,
              "links": [],
              "title": "Node filesystems",
              "vizConfig": {
                "group": "bargauge",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 0.8
                          },
                          {
                            "color": "red",
                            "value": 0.9
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayMode": "basic",
                    "maxVizHeight": 24,
                    "minVizHeight": 16,
                    "namePlacement": "left",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showUnfilled": true,
                    "sizing": "auto",
                    "valueMode": "color"
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-node-fs-trend": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "node_filesystem_avail_bytes{job=\"node-exporter\", fstype=~\"ext4|btrfs|xfs|zfs\", mountpoint!~\"/boot.*|/nix/store\"} * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info{job=\"node-exporter\"})",
                            "instant": false,
                            "legendFormat": "{{nodename}} {{mountpoint}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "",
              "id": 29,
              "links": [],
              "title": "Node filesystem free",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [
                        "lastNotNull",
                        "min"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "Last *",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-node-ro": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "count(node_filesystem_readonly{job=\"node-exporter\", fstype=~\"ext4|btrfs|xfs|zfs\", mountpoint!~\"/boot.*|/nix/store\"} == 1)",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "Node filesystems remounted read-only. iSCSI volumes mounted inside pods are not covered: node-exporter skips kubelet mounts.",
              "id": 30,
              "links": [],
              "title": "Read-only node filesystems",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "noValue": "0",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "red",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "center",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-pv-problems": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "max by (persistentvolume, phase) (kube_persistentvolume_status_phase{phase!=\"Bound\"} == 1) * on (persistentvolume) group_left (claim_namespace, name, storageclass, reclaim_policy) max by (persistentvolume, claim_namespace, name) (kube_persistentvolume_claim_ref) * on (persistentvolume) group_left (storageclass, reclaim_policy) max by (persistentvolume, storageclass, reclaim_policy) (kube_persistentvolume_info)",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "",
                            "range": false,
                            "refId": "pv"
                          },
                          "version": "v0"
                        },
                        "refId": "pv"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": [
                    {
                      "group": "organize",
                      "kind": "Transformation",
                      "spec": {
                        "id": "organize",
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "Value": true
                          },
                          "renameByName": {
                            "claim_namespace": "last namespace",
                            "name": "last claim"
                          }
                        }
                      }
                    }
                  ]
                }
              },
              "description": "Released and Failed PersistentVolumes. With the Retain policy the NAS LUN outlives the claim; delete the LUN on the NAS after checking nothing needs it.",
              "id": 25,
              "links": [],
              "title": "Volumes not Bound",
              "vizConfig": {
                "group": "table",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  },
                  "options": {
                    "cellHeight": "sm",
                    "showHeader": true
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-raid": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "1 - raidFreeSize / raidTotalSize",
                            "instant": true,
                            "legendFormat": "{{raidName}}",
                            "range": false,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "",
              "id": 26,
              "links": [],
              "title": "Pools and volumes",
              "vizConfig": {
                "group": "bargauge",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 0.85
                          },
                          {
                            "color": "red",
                            "value": 0.95
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayMode": "basic",
                    "maxVizHeight": 24,
                    "minVizHeight": 16,
                    "namePlacement": "left",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showUnfilled": true,
                    "sizing": "auto",
                    "valueMode": "color"
                  }
                },
                "version": "13.2.3"
              }
            }
          },
          "be-raid-trend": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "expr": "raidFreeSize",
                            "instant": false,
                            "legendFormat": "{{raidName}}",
                            "range": true,
                            "refId": "A"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "30d"
                  },
                  "transformations": []
                }
              },
              "description": "A falling line on the iSCSI volume eats into every thin-provisioned PVC.",
              "id": 27,
              "links": [],
              "title": "Free space, 30 days",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisSoftMin": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "lineWidth": 1,
                        "showPoints": "never",
                        "spanNulls": false
                      },
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [
                        "lastNotNull",
                        "min"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "Last *",
                      "sortDesc": true
                    },
