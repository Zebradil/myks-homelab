apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: vmks-storage
spec:
  groups:
    - name: storage
      rules:
        - alert: PersistentVolumeFillingUpSoon
          annotations:
            description: Based on 7d sampling, the PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is expected to fill up within two weeks. Currently {{ $value | humanizePercentage }} is available.
            summary: PersistentVolume is projected to fill up within two weeks.
          expr: |
            (
              kubelet_volume_stats_available_bytes{job="kubelet"}
                /
              kubelet_volume_stats_capacity_bytes{job="kubelet"}
            )
            and
            predict_linear(kubelet_volume_stats_available_bytes{job="kubelet"}[7d], 14 * 24 * 3600) < 0
            unless on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"} == 1
            unless on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
          for: 6h
          labels:
            severity: warning
