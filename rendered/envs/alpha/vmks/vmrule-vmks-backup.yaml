apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: vmks-backup
spec:
  groups:
    - name: backup
      rules:
        - alert: BackupStale
          annotations:
            description: CronJob {{ $labels.namespace }}/backup has had no successful run for {{ $value | humanizeDuration }}.
            summary: Backup has not succeeded in over 36 hours.
          expr: |
            time() - (
              kube_cronjob_status_last_successful_time{cronjob="backup"}
                or on(namespace, cronjob)
              kube_cronjob_created{cronjob="backup"}
            ) > 36 * 3600
          labels:
            severity: warning
