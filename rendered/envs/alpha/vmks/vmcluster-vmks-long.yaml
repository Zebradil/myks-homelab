apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  labels:
    app.kubernetes.io/component: vmcluster
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: vmks-long
  namespace: vmks
spec:
  clusterVersion: v1.151.0-cluster
  replicationFactor: 1
  retentionPeriod: 5y
  vminsert:
    extraArgs: {}
    port: "8480"
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi
  vmselect:
    extraArgs:
      search.maxConcurrentRequests: "8"
      storageNode: vmstorage-vmks-0.vmstorage-vmks.vmks.svc.cluster.local.:8401,vmstorage-vmks-long-0.vmstorage-vmks-long.vmks.svc.cluster.local.:8401
    replicaCount: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 384Mi
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
  vmstorage:
    replicaCount: 1
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 20m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
    storageDataPath: /vm-data
