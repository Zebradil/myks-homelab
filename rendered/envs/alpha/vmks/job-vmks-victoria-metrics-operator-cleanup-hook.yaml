apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-3"
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/name: victoria-metrics-operator
  name: vmks-victoria-metrics-operator-cleanup-hook
  namespace: vmks
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: vmks
        app.kubernetes.io/name: victoria-metrics-operator
      name: vmks-victoria-metrics-operator
    spec:
      containers:
        - args:
            - delete
            - vlagent,vlcluster,vldistributed,vlogs,vlsingle,vmagent,vmalert,vmalertmanager,vmalertmanagerconfig,vmanomaly,vmanomalyconfig,vmauth,vmcluster,vmdistributed,vmnodescrape,vmpodscrape,vmprobe,vmrule,vmscrapeconfig,vmservicescrape,vmsingle,vmstaticscrape,vmuser,vtcluster,vtsingle
            - --all
            - --ignore-not-found=true
          command:
            - kubectl
          image: oci.zebradil.dev/registry.k8s.io-cache/kubectl@sha256:b678a2eb762525ff5064ed6064071fc0728bf0f009a6afbe7f49fbad3ac56dbf
          name: kubectl
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 56Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      serviceAccountName: vmks-victoria-metrics-operator-cleanup-hook
