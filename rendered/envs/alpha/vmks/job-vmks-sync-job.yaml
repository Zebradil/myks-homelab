apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/component: syncJob
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: vmks-sync-job
  namespace: vmks
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: syncJob
        app.kubernetes.io/instance: vmks
        app.kubernetes.io/name: victoria-metrics-k8s-stack
    spec:
      containers:
        - env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE
              value: vmks
            - name: RESOURCE_PREFIX
              value: vmks
            - name: PRUNE
              value: "true"
            - name: OWNER_REFERENCES
              value: "true"
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          image: oci.zebradil.dev/ghcr.io-cache/victoriametrics/sync-job@sha256:e8eef7b2f8eb962230f71c720fc099280d9c89f3b4c199953dee59b91c83f201
          name: sync-job
          volumeMounts:
            - mountPath: /etc/config
              name: config
              readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: vmks-sync-job
      volumes:
        - configMap:
            name: vmks-sync-job-config
          name: config
  ttlSecondsAfterFinished: 600
