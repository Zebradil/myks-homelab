apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: vmks-kube-api-server
  namespace: vmks
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      metricRelabelConfigs:
        - action: keep
          regex: (apiserver|apiextensions|aggregator|process|go|rest_client)_.+|workqueue_depth
          sourceLabels:
            - __name__
        - action: drop
          regex: apiserver_(request_duration_seconds|request_body_size_bytes|watch_list_duration_seconds|response_sizes|watch_cache_read_wait_seconds|watch_events_sizes)_bucket
          sourceLabels:
            - __name__
      port: https
      scheme: https
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        serverName: kubernetes
  jobLabel: component
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
