apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: stats-vpn
spec:
  entryPoints:
    - vpn-web
    - vpn-websecure
  routes:
    - kind: Rule
      match: Host(`stats.ts.zebradil.dev`) || Host(`stats.junior.ts.zebradil.dev`)
      services:
        - name: umami
          port: http
