apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: stats-tracker
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: (Host(`stats.zebradil.dev`) || Host(`stats.junior.zebradil.dev`)) && (Path(`/app.js`) || Path(`/e`))
      services:
        - name: umami
          port: http
