apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  labels:
    actions.github.com/controller-service-account-name: arc-gha-rs-controller
    actions.github.com/controller-service-account-namespace: arc-system
    app.kubernetes.io/instance: arc
    app.kubernetes.io/name: gha-rs-controller
    app.kubernetes.io/namespace: arc-system
    app.kubernetes.io/part-of: gha-rs-controller
  name: arc-gha-rs-controller
  namespace: arc-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: arc
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/namespace: arc-system
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/instance: arc
        app.kubernetes.io/name: gha-rs-controller
        app.kubernetes.io/namespace: arc-system
        app.kubernetes.io/part-of: gha-rs-controller
    spec:
      containers:
        - args:
            - --auto-scaling-runner-set-only
            - --log-level=debug
            - --log-format=text
            - --autoscaling-runner-set-max-concurrent-reconciles=2
            - --autoscaling-listener-max-concurrent-reconciles=2
            - --ephemeral-runner-set-max-concurrent-reconciles=2
            - --ephemeral-runner-max-concurrent-reconciles=4
            - --listener-metrics-addr=0
            - --listener-metrics-endpoint=
            - --metrics-addr=0
          command:
            - /manager
          env:
            - name: CONTROLLER_MANAGER_CONTAINER_IMAGE
              value: ghcr.io/actions/gha-runner-scale-set-controller:0.15.0
            - name: CONTROLLER_MANAGER_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: oci.zebradil.dev/ghcr.io-cache/actions/gha-runner-scale-set-controller@sha256:162dfb5bfbda9e7e49fbed67d428994c9ced55b41a37a18b75b46dab0aa98d37
          name: manager
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      serviceAccountName: arc-gha-rs-controller
      terminationGracePeriodSeconds: 35
      volumes:
        - emptyDir: {}
          name: tmp
