apiVersion: v1
data:
  Caddyfile: |
    :8080 {
    	handle /probe/cam1 {
    		rewrite * /cam
    		reverse_proxy cams-cam1:80
    	}
    	handle /probe/cam2 {
    		rewrite * /cam
    		reverse_proxy cams-cam2:80
    	}
    	handle /probe/cam3 {
    		rewrite * /cam
    		reverse_proxy cams-cam3:80
    	}
    	handle {
    		root * /srv
    		file_server
    	}
    }
  cameras.json: '{"cameras":[{"id":"cam1","label":"Camera 1"},{"id":"cam2","label":"Camera 2"},{"id":"cam3","label":"Camera 3"}]}'
kind: ConfigMap
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: cams-cameras
