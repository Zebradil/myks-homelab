apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a8r.io/repository: https://github.com/Zebradil/myks-homelab
  name: cams
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cams
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cams
    spec:
      containers:
        - image: oci.zebradil.dev/zebradil/homelab/maks-cams/caddy@sha256:56e18aa1838b828f7517f49359fb1df08be8bbaecd3091dabdcc16f904d39f80
          name: caddy
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - net_bind_service
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsUser: 1001
          volumeMounts:
            - mountPath: /config
              name: caddy-data
            - mountPath: /data
              name: caddy-data
            - mountPath: /srv/config
              name: cameras-config
            - mountPath: /etc/caddy
              name: caddy-config
      volumes:
        - emptyDir: {}
          name: caddy-data
        - configMap:
            items:
              - key: cameras.json
                path: cameras.json
            name: cams-cameras
          name: cameras-config
        - configMap:
            items:
              - key: Caddyfile
                path: Caddyfile
            name: cams-cameras
          name: caddy-config
