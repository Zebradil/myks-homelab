#@ load("@ytt:data", "data")

#@ a = data.values.application
#@ name = data.values.myks.context.app

---
#! The box runs natively on daddy (znix modules/hosts/daddy), which serves
#! kasha.lan.zebradil.dev itself. Its plain-HTTP port admits only the k3s
#! nodes, so vmagent scrapes it by IP and kasha metrics do not depend on DNS or
#! caddy.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: #@ name + "-box"
spec:
  jobName: #@ name
  targetEndpoints:
    - targets:
        -  #@ a.boxAddress + ":" + str(a.port)
