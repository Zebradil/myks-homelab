#@ load("@ytt:data", "data")
#@ load("secrets.star", "sops")

#@ a = data.values.application
#@ m = data.values.myks
#@ name = m.context.app

#@ pod_labels = {"app.kubernetes.io/name": name}

#@ data_root = "/kasha"

#! Non-secret env. AWS_* R2 creds and the write token come from the Secret
#! (see secret.ytt.yaml).
#@ envs = {
#@   "KASHA_DATA": data_root,
#@   "KASHA_LISTEN": "0.0.0.0:" + str(a.port),
#@   "KASHA_TRUSTED_KEYS": a.trustedKeys,
#@   "KASHA_REMOTE": sops("0", "cache-s3-url"),
#@   "KASHA_SYNC_INTERVAL": str(a.syncInterval),
#@ }
#@ build_envs = lambda x: [{"name": k, "value": v} for k, v in x.items()]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: #@ name
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: #@ a.storageSize
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #@ name
spec:
  replicas: 1
  selector:
    matchLabels: #@ pod_labels
  strategy:
    #! RWO PVC can't be mounted by old and new pods at once during a rollout.
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels: #@ pod_labels
    spec:
      containers:
        - name: #@ name
          image: #@ a.image
          env: #@ build_envs(envs)
          envFrom:
            - secretRef:
                name: #@ name
          ports:
            - containerPort: #@ a.port
              name: http
          readinessProbe:
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nix-cache-info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
          resources:
            requests:
              cpu: 300m
              memory: 1100Mi
            limits:
              memory: 1100Mi
          volumeMounts:
            #! PVC at /kasha (= KASHA_DATA): the flat binary-cache store.
            - name: #@ name
              mountPath: #@ data_root
      volumes:
        - name: #@ name
          persistentVolumeClaim:
            claimName: #@ name
---
apiVersion: v1
kind: Service
metadata:
  name: #@ name
spec:
  selector: #@ pod_labels
  ports:
    - name: http
      port: 80
      targetPort: http
