#@data/values-schema
---
#@overlay/match-child-defaults missing_ok=True
application:
  #! Repositories of githubOwner that get a scale set each.
  repos: ['']
  #@schema/validation min_len=1
  githubOwner: ''
  #! The runs-on label every scale set registers as.
  #@schema/validation min_len=1
  runnerLabel: ''
  #! Per repository. Also the pod count of the namespace quota: one repository
  #! may take the whole pool.
  maxRunners: 1
  #! Resources of every runner pod; the quota allows maxRunners of them.
  runner:
    #@schema/validation min_len=1
    cpu: ''
    #@schema/validation min=1
    memoryGi: 0
    #@schema/validation min=1
    memoryLimitGi: 0
  #! daddy: Nix builds as `nixci` (SSH), the kasha box (HTTPS) and BuildKit (mTLS).
  #@schema/validation min_len=1
  daddyAddress: ''
  #@schema/validation min_len=1
  daddyHostKey: ''

  #! values shared across plugins, do not change
  _:
    secretName: arc-homelab-app-credentials
    chartPrefix: homelab-
    #! Listeners run here too, keeping them out of the runner namespace's quota.
    controllerNamespace: arc-system
    priorityClassName: homelab-runner
    nixciSecretName: nixci-ssh-key
    buildkitSecretName: buildkit-client-tls
    buildkitPort: 1234
