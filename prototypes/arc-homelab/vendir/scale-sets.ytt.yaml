#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ a = data.values.application
#@ chart = data.values.prototype.sources["scale-set"].helmChart

#! myks identifies a chart by its directory and each release needs its own
#! values, so every repository gets its own copy of the scale set chart.
#@overlay/match by=overlay.subset({"kind": "Config"})
---
directories:
  #@overlay/match by=overlay.subset({"path": "charts/scale-set"})
  #@overlay/remove
  -
  #@ for repo in a.repos:
  #@overlay/append
  - path: #@ "charts/" + a._.chartPrefix + repo
    contents:
      - path: .
        lazy: true
        helmChart:
          name: #@ chart.name
          version: #@ chart.version
          repository:
            url: #@ chart.url
  #@ end
