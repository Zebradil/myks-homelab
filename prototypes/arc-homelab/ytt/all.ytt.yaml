#@ load("@ytt:data", "data")
#@ load("/secrets.star", "sops")

#@ dv = data.values
#@ a = dv.application

---
apiVersion: v1
kind: Namespace
metadata:
  name: #@ a._.controllerNamespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: #@ dv.myks.context.app
  labels:
    #! Only runner pods live here (listeners run in the controller namespace).
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: #@ a._.secretName
  namespace: #@ dv.myks.context.app
stringData: #@ { "github_app_" + k: sops("0", k) for k in ["id", "installation_id", "private_key"] }
