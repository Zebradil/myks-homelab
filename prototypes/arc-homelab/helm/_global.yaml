#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")
#@ load("util.star", res="resources")

#@ dv = data.values
#@ a = dv.application
#@ chart = dv.myks.context.helm.chart
#@ if chart.startswith(a._.chartPrefix):
#@ repo = chart[len(a._.chartPrefix):]
#@ key_path = "/etc/nixci/id_ed25519"
#@ nixci_store = "ssh-ng://nixci@{}?ssh-key={}&base64-ssh-public-host-key={}".format(a.daddyAddress, key_path, base64.encode(a.daddyHostKey))
---
githubConfigUrl: #@ "https://github.com/{}/{}".format(a.githubOwner, repo)
githubConfigSecret: #@ a._.secretName
#! The chart names Kubernetes objects after the scale set name (the release
#! name, unique per repository); jobs select the shared label with runs-on.
scaleSetLabels:
  - #@ a.runnerLabel
minRunners: 0
maxRunners: #@ a.maxRunners
controllerServiceAccount:
  namespace: #@ a._.controllerNamespace
  #! Matches the ServiceAccount the `arc` chart renders.
  name: arc-gha-rs-controller
listenerTemplate:
  spec:
    containers:
      #! The chart merges a container named "listener" into its own listener container.
      - name: listener
        resources: #@ res("10m", "32Mi", "128Mi")
template:
  spec:
    #! Jobs run untrusted code next to homelab services: no API access, no escalation.
    automountServiceAccountToken: false
    priorityClassName: #@ a._.priorityClassName
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
      #! Gives the runner group read access to the mounted key.
      fsGroup: 1001
    volumes:
      - name: nixci
        secret:
          secretName: #@ a._.nixciSecretName
          #! Root-owned and group-readable: ssh accepts it because the runner does not own it.
          defaultMode: 0440
      - name: buildkit
        secret:
          secretName: #@ a._.buildkitSecretName
          defaultMode: 0440
    containers:
      - name: runner
        #! Jobs mostly evaluate and wait on daddy; heavy builds run there.
        resources: #@ res("1", "3Gi", "6Gi")
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        #! Built and published by znix (modules/flake/homelab-runner.nix); Renovate follows the digest of `latest`.
        #! renovate: datasource=docker digest
        image: ghcr.io/zebradil/homelab-runner:latest@sha256:a72874eb1253216db720fcc61b606033431030c5da0202a230888c965068d610
        command: [/bin/run.sh]
        env:
          #! Untrusted store user on daddy: jobs build there but cannot add unsigned paths.
          #! nix-ci's build action reads this name and builds in that store.
          - name: NIX_CI_STORE
            value: #@ nixci_store
          #! Rootless BuildKit on daddy for buildx's remote driver; the client
          #! certificate and CA are in /etc/buildkit.
          - name: BUILDKIT_HOST
            value: #@ "tcp://{}:{}".format(a.daddyAddress, a._.buildkitPort)
        volumeMounts:
          - name: nixci
            mountPath: /etc/nixci
            readOnly: true
          - name: buildkit
            mountPath: /etc/buildkit
            readOnly: true
#@ end
