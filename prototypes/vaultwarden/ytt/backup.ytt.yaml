#@ load("@ytt:data", "data")
#@ load("@ytt:library", "library")
#@ load("@ytt:template", "template")
#@ load("secrets.star", "sops")

#@ a = data.values.application
#@ name = a.name or data.values.myks.context.app

#! Maps typed `any` in the library schema have no keys to overlay, hence overlay/replace.
#@ def values():
host: #@ name
#@overlay/replace
secretEnv:
  RESTIC_REPOSITORY: #@ sops("backup", "restic-repository")
  RESTIC_PASSWORD: #@ sops("backup", "restic-password")
  AWS_ACCESS_KEY_ID: #@ sops("backup", "aws-access-key-id")
  AWS_SECRET_ACCESS_KEY: #@ sops("backup", "aws-secret-access-key")
#@overlay/replace
dump:
  name: dump
  image: #@ a.image
  #! `vaultwarden backup` runs VACUUM INTO next to the live database and prints the file name. The file is moved off
  #! the PVC so copies don't pile up there. The name is parsed rather than globbed, to leave alone backups made from
  #! the admin panel; if the message format changes, the job fails instead of backing up nothing.
  command: [/bin/sh, -c]
  args:
    - |
      set -eu
      f=$(/vaultwarden backup | sed -n "s/^Backup to '\(.*\)' was successful$/\1/p")
      test -n "$f"
      mv "/$f" /backup/db.sqlite3
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  volumeMounts:
    - name: data
      mountPath: /data
paths:
  - /data
excludes:
  - /data/db.sqlite3*
  - /data/icon_cache
volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
mounts:
  - name: data
    mountPath: /data
    readOnly: true
#@overlay/replace
affinityPodLabels:
  app.kubernetes.io/name: #@ name
#@overlay/replace
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
#@ end

--- #@ template.replace(library.get("backup").with_data_values(values()).eval())
