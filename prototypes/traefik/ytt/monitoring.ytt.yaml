#@ load("@ytt:data", "data")
#@ load("grafana.lib.yaml", "gen_dashboard")

#@ for file in data.list():
#@ if/end file.startswith("grafana/"):
--- #@ gen_dashboard(file, name="traefik-dashboard")
#@ end
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: traefik-host-metrics
spec:
  path: /metrics
  port: '19100'
  #! Traefik is pinned to the edge nodes, so only they listen on 19100.
  #! Without the selector the scrape targets every node and reports 3/4 down.
  selector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values: #@ data.values.environment.edgeNodes
