#@data/values-schema
---
#@overlay/match-child-defaults missing_ok=True
application:
  #@schema/validation min_len=1
  image: ''
  ingress: true
  name: ''
  containerPort: 80
  serviceMonitor: false
  env:
    - name: TZ
      value: UTC
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
