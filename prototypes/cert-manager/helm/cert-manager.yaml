#@ load("@ytt:data", "data")
#@ load("util.star", res="resources")

#@ ap = data.values.application

---
ingressShim:
  defaultIssuerName: #@ ap._.defaultIssuerName
  defaultIssuerKind: 'ClusterIssuer'
crds:
  enabled: true
  keep: false
prometheus:
  servicemonitor:
    enabled: true
resources: #@ res("10m", "64Mi", "256Mi")
webhook:
  resources: #@ res("10m", "32Mi", "128Mi")
cainjector:
  resources: #@ res("10m", "96Mi", "256Mi")
startupapicheck:
  resources: #@ res("10m", "32Mi", "128Mi")

#! Node DNS points at Tailscale MagicDNS, which resolves *.zebradil.dev via the
#! internal split-horizon resolver. That resolver answers every name under the
#! zone with a wildcard CNAME to lan.zebradil.dev, so the ACME _acme-challenge
#! TXT records are invisible from inside the cluster and the DNS-01 self-check
#! never passes. Force the self-check onto public recursive resolvers.
dns01RecursiveNameservers: 1.1.1.1:53,9.9.9.9:53
dns01RecursiveNameserversOnly: true
