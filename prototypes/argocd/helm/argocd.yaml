#@ load("util.star", res="resources")

---
#@ for/end component in ["controller", "redis", "repoServer", "server", "notifications"]:
#@yaml/text-templated-strings
(@= component @):
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
---
redis:
  exporter:
    enabled: true
---
configs:
  cm:
    application.resourceTrackingMethod: annotation
    #! Diff against a server-side apply dry-run so API-server and webhook defaults
    #! (e.g. VMRule's `record: ""`) don't register as permanent drift.
    controller.diff.server.side: 'true'
    kustomize.enabled: 'false'
    jsonnet.enabled: 'false'
    helm.enabled: 'false'
---
controller:
  resources: #@ res("100m", "1Gi", "2Gi")
dex:
  resources: #@ res("10m", "48Mi", "128Mi")
  initImage:
    resources: #@ res("10m", "16Mi", "128Mi")
redis:
  resources: #@ res("10m", "64Mi", "128Mi")
  exporter:
    resources: #@ res("10m", "16Mi", "64Mi")
redisSecretInit:
  resources: #@ res("10m", "16Mi", "64Mi")
server:
  resources: #@ res("10m", "96Mi", "256Mi")
repoServer:
  resources: #@ res("50m", "192Mi", "1Gi")
  copyutil:
    resources: #@ res("10m", "16Mi", "128Mi")
applicationSet:
  resources: #@ res("10m", "48Mi", "128Mi")
notifications:
  resources: #@ res("10m", "64Mi", "128Mi")
