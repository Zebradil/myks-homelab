#@ load("@ytt:data", "data")
#@ load("@ytt:json", "json")
#@ load("traefik.lib.yaml", "route")

#@ name = data.values.myks.context.app

#@ cams = {
#@   "cam1": {"ip": "192.168.0.201", "label": "Camera 1"},
#@   "cam2": {"ip": "192.168.0.202", "label": "Camera 2"},
#@   "cam3": {"ip": "192.168.0.203", "label": "Camera 3"},
#@ }

#! ---------------------------------------------------------------------------
#! Access control is split between here and the board.
#!
#! route.default() emits three IngressRoutes per camera. Only the WAN pair
#! (web/websecure) carries chain-authelia-auth; the lan and vpn routes are
#! deliberately unauthenticated, because LAN and VPN are the trusted zone and a
#! login prompt in front of a camera on your own network excludes no attacker.
#!
#! The boards themselves grant read to anyone and publish to nobody — MediaMTX
#! fills the path from the CSI camera internally, so no client ever needs to
#! authenticate to it. See the rpiz repo's README, "Access control".
#!
#! Port 8889 is WebRTC, the only protocol still enabled on the boards; RTSP,
#! RTMP, SRT and HLS are off there because nothing here consumes them.
#! ---------------------------------------------------------------------------

#@ cam_list = []
#@ for cam_id in sorted(cams.keys()):
#@   cam_list.append({"id": cam_id, "label": cams[cam_id]["label"]})
#@ end

#! Tab indentation is what `caddy fmt` produces.
#@ def caddyfile():
#@   lines = [":8080 {"]
#@   for cam_id in sorted(cams.keys()):
#@     lines.append("\thandle /probe/" + cam_id + " {")
#@     lines.append("\t\trewrite * /cam")
#@     lines.append("\t\treverse_proxy " + name + "-" + cam_id + ":80")
#@     lines.append("\t}")
#@   end
#@   lines.append("\thandle {")
#@   lines.append("\t\troot * /srv")
#@   lines.append("\t\tfile_server")
#@   lines.append("\t}")
#@   lines.append("}")
#@   return "\n".join(lines) + "\n"
#@ end

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: #@ name + "-cameras"
data:
  cameras.json: #@ json.encode({"cameras": cam_list})
  #! The page probes cameras through these routes instead of talking to them
  #! directly: a cross-origin probe cannot read a status code without CORS
  #! headers, and neither MediaMTX nor Traefik's 502 sends any.
  Caddyfile: #@ caddyfile()


#@ for cam_id in sorted(cams.keys()):
#@ cam_name = name + "-" + cam_id
#@ for/end route_doc in route.default(cam_name):
--- #@ route_doc
---
apiVersion: v1
kind: Service
metadata:
  name: #@ cam_name
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8889
---
apiVersion: v1
kind: Endpoints
metadata:
  name: #@ cam_name
subsets:
  - addresses:
      - ip: #@ cams[cam_id]["ip"]
    ports:
      - port: 8889
        name: http
#@ end
