#@ load("@ytt:data", "data")
#@ load("traefik.lib.yaml", "route")

#@ e = data.values.environment
#@ name = data.values.myks.context.app

#@ pod_labels = { "app.kubernetes.io/name": name }
#@ cameras_cm = name + "-cameras"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #@ name
spec:
  selector:
    matchLabels: #@ pod_labels
  template:
    metadata:
      labels: #@ pod_labels
    spec:
      containers:
        - image: caddy-image-ref
          name: caddy
          volumeMounts:
            - name: caddy-data
              mountPath: /config
            - name: caddy-data
              mountPath: /data
            - name: cameras-config
              mountPath: /srv/config
            - name: caddy-config
              mountPath: /etc/caddy
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
              add:
                - net_bind_service
            privileged: false
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
      volumes:
        - name: caddy-data
          emptyDir: {}
        #! Both come from the same ConfigMap, split by key: the Caddyfile has no
        #! business being served under /srv/config, and vice versa.
        - name: cameras-config
          configMap:
            name: #@ cameras_cm
            items:
              - key: cameras.json
                path: cameras.json
        - name: caddy-config
          configMap:
            name: #@ cameras_cm
            items:
              - key: Caddyfile
                path: Caddyfile

---
apiVersion: v1
kind: Service
metadata:
  name: #@ name
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector: #@ pod_labels


#@ for/end route_doc in route.default(name):
--- #@ route_doc
