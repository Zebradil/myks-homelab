#@ load("@ytt:data", "data")

#@ d = data.values
#@ name = d.myks.context.app
#@ t = d.environment.traefik

#@ def host_matches(hosts):
#@   ms = []
#@   for h in hosts:
#@     ms.append("Host(`{}.{}`)".format(name, h))
#@   end
#@   return "(" + " || ".join(ms) + ")"
#@ end

#! claude.ai cannot pass an Authelia interstitial, so this route is deliberately
#! UNAUTHENTICATED (no chain-authelia-auth middleware) and limited to the MCP
#! transport + the OAuth protected-resource metadata. /healthz, /readyz and
#! /metrics stay off the public edge (reachable only via the Service).
#! PathPrefix, not Path: RFC 9728 §3.1 puts the resource's path after the
#! well-known segment (`…/oauth-protected-resource/mcp`), and that is the URL
#! MCP clients try first. Anything not matched here falls through to
#! authelia-catch-all, which answers discovery with a login redirect instead of
#! a 404 — clients then give up and fall back to legacy /authorize on this host.
#@ path_match = "(PathPrefix(`/mcp`) || PathPrefix(`/.well-known/oauth-protected-resource`))"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: #@ name
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: #@ host_matches(t.hosts.web) + " && " + path_match
      services:
        - name: #@ name
          port: http
---
#! Same route on the LAN entrypoints. The public one binds the node's IPv6
#! address, but split-horizon DNS points the host at the LAN IPv4, so without
#! this an IPv4 client at home matches only authelia-catch-all and gets an
#! Authelia interstitial instead of the server. Keeps the canonical web hosts in
#! the match: the URL is the OAuth audience, so a LAN-only hostname would make
#! kb-mcp reject the JWT's `aud`. Unauthenticated at the edge for the same
#! reason as the public route — kb-mcp enforces bearer/JWT auth itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: #@ name + "-lan"
spec:
  entryPoints:
    - lan-web
    - lan-websecure
  routes:
    - kind: Rule
      match: #@ host_matches(t.hosts.lan + t.hosts.web) + " && " + path_match
      services:
        - name: #@ name
          port: http
