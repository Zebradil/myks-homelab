#@ load("util.star", res="resources")
---
fullnameOverride: vmks

#! Since 0.85.0 the chart ships dashboards and rules through a Job that fetches
#! them from GitHub on every sync, which puts them outside git and makes every
#! ArgoCD sync depend on github.com being reachable. We vendir the same upstream
#! sources and render them instead: see ytt/dashboards.ytt.yaml, ytt/rules.ytt.yaml.
syncJob:
  enabled: false

victoria-metrics-operator:
  admissionWebhooks:
    certManager:
      enabled: true
  resources: #@ res("20m", "96Mi", "256Mi")

kube-state-metrics:
  resources: #@ res("10m", "48Mi", "128Mi")

prometheus-node-exporter:
  resources: #@ res("10m", "32Mi", "64Mi")

vmagent:
  spec:
    extraArgs:
      promscrape.dropOriginalLabels: 'false'
    resources: #@ res("150m", "384Mi", "768Mi")
  additionalRemoteWrites:
    - url: 'http://vminsert-vmks-long.vmks.svc.cluster.local.:8480/insert/0/prometheus/api/v1/write'
      inlineUrlRelabelConfig:
        - source_labels: [__name__]
          regex: 'airgradient_.*|outdoor_.*'
          action: keep

vmalert:
  spec:
    resources: #@ res("20m", "64Mi", "256Mi")

alertmanager:
  spec:
    resources: #@ res("10m", "32Mi", "128Mi")

vmsingle:
  enabled: false

vmcluster:
  enabled: true
  spec:
    replicationFactor: 1
    retentionPeriod: 30d
    vmstorage:
      replicaCount: 1
      #! vmstorage sizes its caches from the memory limit, so a working set close to the limit is expected.
      resources: #@ res("150m", "1Gi", "2Gi")
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 20Gi
    vmselect:
      enabled: false
    vminsert:
      replicaCount: 1
      resources: #@ res("70m", "320Mi", "768Mi")

external:
  vm:
    read:
      url: 'http://vmselect-vmks-long.vmks.svc.cluster.local.:8481/select/0/prometheus'

kubeControllerManager:
  service:
    enabled: false

kubeScheduler:
  service:
    enabled: false

#! k3s server uses SQLite/kine, not embedded etcd: no etcd metrics endpoint
#! exists. Disable etcd scrape, rules and dashboards to avoid false alerts.
kubeEtcd:
  enabled: false
