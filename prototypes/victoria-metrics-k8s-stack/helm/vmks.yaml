#@ load("util.star", res="resources")
---
fullnameOverride: vmks

#! Since 0.85.0 the chart ships dashboards and rules through a Job that fetches
#! them from GitHub on every sync, which puts them outside git and makes every
#! ArgoCD sync depend on github.com being reachable. We vendir the same upstream
#! sources and render them instead: see ytt/dashboards.ytt.yaml, ytt/rules.ytt.yaml.
syncJob:
  enabled: false

victoria-metrics-operator:
  admissionWebhooks:
    certManager:
      enabled: true
  resources: #@ res("20m", "96Mi", "256Mi")

kube-state-metrics:
  resources: #@ res("10m", "48Mi", "128Mi")
  #! ARC's own metrics carry no per-run identity. An EphemeralRunner exists for exactly one job and
  #! names it in its status, which gives the Homelab runners dashboard its job timeline and run links.
  rbac:
    extraRules:
      - apiGroups: [actions.github.com]
        resources: [ephemeralrunners]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: actions.github.com
              version: v1alpha1
              kind: EphemeralRunner
            metricNamePrefix: arc_ephemeralrunner
            labelsFromPath:
              ephemeralrunner: [metadata, name]
              namespace: [metadata, namespace]
              organization: [metadata, labels, actions.github.com/organization]
              repository: [metadata, labels, actions.github.com/repository]
            metrics:
              - name: job_info
                help: Workflow job the runner was assigned; job labels stay empty until GitHub assigns one.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      job_display_name: [status, jobDisplayName]
                      workflow_ref: [status, jobWorkflowRef]
                      workflow_run_id: [status, workflowRunId]
                      #! RFC 3339 sorts as text, so the timeline orders its rows by this label.
                      created: [metadata, creationTimestamp]
              - name: created
                help: Unix time the runner was created, which picks the latest runner of a job name.
                each:
                  type: Gauge
                  gauge:
                    path: [metadata, creationTimestamp]

prometheus-node-exporter:
  resources: #@ res("10m", "32Mi", "64Mi")

vmagent:
  spec:
    extraArgs:
      promscrape.dropOriginalLabels: 'false'
    resources: #@ res("150m", "384Mi", "768Mi")
  additionalRemoteWrites:
    - url: 'http://vminsert-vmks-long.vmks.svc.cluster.local.:8480/insert/0/prometheus/api/v1/write'
      inlineUrlRelabelConfig:
        - source_labels: [__name__]
          regex: 'airgradient_.*|outdoor_.*'
          action: keep

vmalert:
  spec:
    resources: #@ res("20m", "64Mi", "256Mi")

alertmanager:
  spec:
    resources: #@ res("10m", "32Mi", "128Mi")
    #! Keeps silences and the notification log across pod restarts.
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi

vmsingle:
  enabled: false

vmcluster:
  enabled: true
  spec:
    replicationFactor: 1
    retentionPeriod: 30d
    vmstorage:
      replicaCount: 1
      #! vmstorage sizes its caches from the memory limit, so a working set close to the limit is expected.
      resources: #@ res("150m", "1Gi", "2Gi")
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 20Gi
    vmselect:
      enabled: false
    vminsert:
      replicaCount: 1
      resources: #@ res("70m", "320Mi", "768Mi")

external:
  vm:
    read:
      url: 'http://vmselect-vmks-long.vmks.svc.cluster.local.:8481/select/0/prometheus'

#! /metrics/resource repeats cadvisor's container CPU/memory without the image
#! label, so unfiltered queries double-count; nothing reads its pod_*/node_* series.
kubelet:
  vmScrapes:
    resources:
      enabled: false

kubeControllerManager:
  service:
    enabled: false

kubeScheduler:
  service:
    enabled: false

#! k3s server uses SQLite/kine, not embedded etcd: no etcd metrics endpoint
#! exists. Disable etcd scrape, rules and dashboards to avoid false alerts.
kubeEtcd:
  enabled: false
