#! Homelab-owned storage alerts, as opposed to the vendored upstream rules built in rules.ytt.yaml.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: vmks-storage
spec:
  groups:
    - name: storage
      rules:
        #! Upstream's KubePersistentVolumeFillingUp only fires below 15% free, which is too late to
        #! act on for the large volumes here. This one is driven purely by the growth trend.
        - alert: PersistentVolumeFillingUpSoon
          expr: |
            (
              kubelet_volume_stats_available_bytes{job="kubelet"}
                /
              kubelet_volume_stats_capacity_bytes{job="kubelet"}
            )
            and
            predict_linear(kubelet_volume_stats_available_bytes{job="kubelet"}[7d], 14 * 24 * 3600) < 0
            unless on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"} == 1
            unless on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
          #! 7d lookback and a long `for` so media and registry churn don't trip it.
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: PersistentVolume is projected to fill up within two weeks.
            description: >-
              Based on 7d sampling, the PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in namespace
              {{ $labels.namespace }} is expected to fill up within two weeks. Currently
              {{ $value | humanizePercentage }} is available.
