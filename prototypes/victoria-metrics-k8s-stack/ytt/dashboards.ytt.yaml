#! Chart 0.85.0 stopped rendering dashboards; its sync-job pulls them from the
#! upstream repos at deploy time instead. We disable that job (see
#! helm/vmks.yaml), vendir the same sources and build the ConfigMaps here, so
#! the dashboards stay in git. See ytt/rules.ytt.yaml for the same treatment of
#! the alerting rules.

#! Mixin dashboards template a `cluster` variable and filter on it. This is a
#! single cluster and no `cluster` label is attached to the metrics, so bind the
#! variable to a hidden catch-all, matching what the chart used to render. The
#! matcher has to become a regex too: `cluster=".*"` is an exact match on the
#! literal string. The selectors sit inside JSON string values, so the quotes
#! are backslash-escaped in the undecoded document.
#@ def unset_cluster_var(content):
#@   dash = json.decode(content.replace('cluster=\\"$cluster\\"', 'cluster=~\\"$cluster\\"'))
#@   variables = dash.get("templating", {}).get("list", [])
#@   for i in range(len(variables)):
#@     if variables[i]["name"] == "cluster":
#@       variables[i] = {
#@         "name": "cluster",
#@         "label": "cluster",
#@         "type": "constant",
#@         "query": ".*",
#@         "allValue": ".*",
#@         "hide": 2,
#@         "multi": False,
#@         "includeAll": False,
#@       }
#@     end
#@   end
#@   return dash
#@ end

