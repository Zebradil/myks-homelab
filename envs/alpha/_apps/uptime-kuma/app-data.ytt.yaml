#@data/values
---
application:
  #! Monitors arbitrary internal and external targets.
  restrictEgress: false
  #! renovate: datasource=docker
  image: louislam/uptime-kuma:2.5.7
  ingress: false
  containerPort: 3001
  env:
    - name: UPTIME_KUMA_DISABLE_IPV6
      value: '1'
  resources:
    requests:
      cpu: 30m
      memory: 192Mi
    limits:
      memory: 512Mi
