#@ load("@ytt:data", "data")
#@ load("traefik.lib.yaml", "route")

#@ name = data.values.myks.context.app

#! Jellyfin runs natively on daddy (znix); the cluster keeps its URLs and TLS.
#@ for/end route_doc in route.default(name):
--- #@ route_doc

---
apiVersion: v1
kind: Service
metadata:
  name: #@ name
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
#! ArgoCD skips EndpointSlices (resource.exclusions in argocd-cm): apply this one by
#! hand whenever it changes.
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: #@ name + "-endpoints"
  labels:
    kubernetes.io/service-name: #@ name
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8096
endpoints:
  - addresses:
      - 192.168.0.101
    conditions:
      ready: true
      serving: true
      terminating: false

