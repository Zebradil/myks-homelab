# This workflow approves pull requests automatically if the diff of the rendered manifests is insignificant.
---
name: Auto-approve

'on':
  workflow_call:
  pull_request:
    types:
      - converted_to_draft
      - ready_for_review
      - reopened

defaults:
  run:
    shell: bash

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}'
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange OIDC token for GitHub token
        id: sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.zebradil.dev
          scope: ${{ github.repository }}
          identity: myks-render
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Approve or dismiss approval
        id: decision
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          APPROVER_LOGIN: zebradil[bot]
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          export PR_STATE=${{ github.event.pull_request.state }}
          export PR_DRAFT=${{ github.event.pull_request.draft }}
          export PR_MERGEABLE=${{ github.event.pull_request.mergeable }}

          ./.github/scripts/auto-approve.sh
