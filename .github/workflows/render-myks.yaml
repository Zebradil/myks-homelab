---
name: Render with myks

'on':
  pull_request:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      # Before checkout, so actions/checkout stores the App token as the push credential: unlike GITHUB_TOKEN, it makes
      # the render commit start new workflow runs. octo-sts runs in this cluster; when it is down, the GITHUB_TOKEN
      # fallback still pushes the render commit, but no checks run on it, so merging needs an admin bypass.
      - name: Exchange OIDC token for GitHub token
        id: sts
        continue-on-error: true
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.zebradil.dev
          scope: ${{ github.repository }}
          identity: myks-render
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.sts.outputs.token || github.token }}
      - name: Login to Harbor registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
      - name: Derive appropriate SHAs for base and head for myks Smart Mode
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"
      - name: Setup tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Print tools versions
        run: mise list
      - name: Render
        env:
          MYKS_SMART_MODE_BASE_REVISION: ${{ github.base_ref && format('origin/{0}', github.base_ref) || env.NX_BASE }}
        run: |
          myks render
          myks cleanup --cache
      # Rulesets block direct pushes to main, so drift there can only be
      # reported, not auto-committed.
      - name: Check for drift
        if: ${{ github.event_name == 'push' }}
        run: |
          git add --intent-to-add rendered/
          if ! git diff --exit-code --stat rendered/; then
            echo "::error::rendered/ is out of sync with sources; re-render in a pull request"
            git diff rendered/
            exit 1
          fi
      - name: Commit changes
        id: commit
        if: ${{ github.event_name == 'pull_request' }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'chore: render with myks'
          commit_user_name: zebradil[bot]
          commit_user_email: 251525544+zebradil[bot]@users.noreply.github.com
          commit_author: zebradil[bot] <251525544+zebradil[bot]@users.noreply.github.com>
      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION:
            ${{ steps.commit.outputs.changes_detected == 'true' && 'New changes have been committed' || 'Rendered files
            are up to date' }}
          # When running on a PR, set the commit status on the latest commit in
          # the branch. Otherwise, the PR will be waiting for the commit status
          # indefinitely. This, in particular, blocks Renovate from merging PRs
          # automatically.
          # If running on a push, set the commit status on the current commit.
          SHA: ${{ steps.commit.outputs.commit_hash || github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context=myks \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  auto-approve:
    needs: render
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/auto-approve.yaml
    permissions:
      contents: read
      id-token: write
