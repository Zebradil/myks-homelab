#@ load("@ytt:json", "json")
#@ load("@ytt:assert", "assert")

#! Wrap a dashboard JSON file in a grafana_dashboard ConfigMap.
#!
#!   #@ load("@ytt:data", "data")
#!   #@ load("grafana.lib.yaml", "gen_dashboard")
#!
#!   #@ for file in data.list():
#!   #@ if/end file.startswith("dashboards_out/"):
#!   --- #@ gen_dashboard(file)
#!   #@ end

#@ def gen_dashboard(file, name=""):
#@   if name == "":
#@     basename = file.rpartition("/")[-1]
#@     name = basename.rpartition(".")[0][:63]
#@   else:
#@     basename = name + ".json"
#@   end
#@   # Quickly validate and format the JSON content
#@   content = json.encode(json.decode(data.read(file)), indent=2)
apiVersion: v1
kind: ConfigMap
metadata:
  name: #@ name
  labels:
    grafana_dashboard: '1'
data: #@ { basename: content }
#@ end

---
#! Wrap an already-decoded dashboard object in a grafana_dashboard ConfigMap.
#! Use when the dashboard JSON needs mutating (datasource rewrites, dropping
#! __inputs, injecting template vars) before emit — do that on the object, then
#! pass it here.
#!
#!   #@ load("grafana.lib.yaml", "gen_dashboard_obj")
#!   #@ dash = json.decode(data.read("board.json").replace("${DS_PROMETHEUS}", "${datasource}"))
#!   #@ dash.pop("__inputs", None)
#!   --- #@ gen_dashboard_obj("my-dashboard", dash)

#@ def gen_dashboard_obj(name, dash):
#@   if len(name) > 63:
#@     assert.fail("dashboard ConfigMap name {} exceeds 63 chars".format(name))
#@   end
apiVersion: v1
kind: ConfigMap
metadata:
  name: #@ name
  labels:
    grafana_dashboard: '1'
data: #@ { name + ".json": json.encode(dash, indent=2) }
#@ end
