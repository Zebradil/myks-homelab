#@data/values-schema
---
#! renovate: datasource=docker
image: restic/restic:0.19.1
schedule: "30 3 * * *"
#! Caps the whole run, not only the wait for a schedulable node. Raise it for apps whose first
#! full backup takes longer than this, or the job fails every night with DeadlineExceeded.
timeoutSeconds: 3600
#! Passed as `restic --host`, which scopes `forget` to this app's snapshots.
#@schema/validation min_len=1
host: ""
retention:
  daily: 7
  weekly: 4
  monthly: 12
#! Ceiling on what one prune run repacks, so a large repository cannot spend the whole window
#! (and the egress budget) rewriting pack files. What is left over is repacked the next night.
maxRepackSize: 1G
#! Share of the pack files whose hashes are verified after each run; the repository is covered
#! in full every ~20 runs. Without it bit rot is only discovered during a restore.
checkReadDataSubset: 5%
#! Cap on the dump emptyDir, so a runaway dump evicts this pod instead of filling the node's disk.
scratchSizeLimit: 2Gi
#! RESTIC_REPOSITORY, RESTIC_PASSWORD and the S3 credentials, usually sops refs.
#@schema/type any=True
#@schema/validation min_len=1
secretEnv: {}
#! Container that writes a consistent dump into /backup (mounted automatically).
#@schema/type any=True
#@schema/validation min_len=1
dump: {}
#! Paths backed up alongside /backup, for files that are safe to copy live.
paths: [""]
excludes: [""]
#@schema/type any=True
volumes: []
#! Mounts for the restic backup container, in addition to /backup.
#@schema/type any=True
mounts: []
#! Labels of the pod that holds the RWO volumes: the job has to run on the same node.
#@schema/type any=True
affinityPodLabels: null
#! Needs an fsGroup whenever it sets runAsUser, or restic cannot write its cache emptyDir.
#@schema/type any=True
podSecurityContext: {}
